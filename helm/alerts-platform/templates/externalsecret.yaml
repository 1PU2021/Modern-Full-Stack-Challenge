apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerts-runtime-secrets
  namespace: {{ .Values.global.namespace }}

spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore

  target:
    name: alerts-runtime-secrets
    creationPolicy: Owner

    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgres://{{ `{{ .DB_USERNAME }}` }}:{{ `{{ .DB_PASSWORD }}` }}@{{ `{{ .DB_HOST }}` }}:{{ `{{ .DB_PORT }}` }}/{{ `{{ .DB_NAME }}` }}?sslmode=verify-full

        APP_DATABASE_URL: >-
          postgres://{{ `{{ .DB_USERNAME }}` }}:{{ `{{ .DB_PASSWORD }}` }}@{{ `{{ .DB_HOST }}` }}:{{ `{{ .DB_PORT }}` }}/{{ `{{ .DB_NAME }}` }}?sslmode=verify-full

        JWT_SECRET: {{ `{{ .JWT_SECRET }}` | quote }}
        PLATFORM_JWT_SECRET: {{ `{{ .PLATFORM_JWT_SECRET }}` | quote }}
        DEMO_USER_PASSWORD: {{ `{{ .DEMO_USER_PASSWORD }}` | quote }}

  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.appDbSecretName }}
        property: username

    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.appDbSecretName }}
        property: password

    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.externalSecrets.appDbSecretName }}
        property: host

    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.externalSecrets.appDbSecretName }}
        property: port

    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.externalSecrets.appDbSecretName }}
        property: dbname

    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.runtimeSecretName }}
        property: JWT_SECRET

    - secretKey: PLATFORM_JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.runtimeSecretName }}
        property: PLATFORM_JWT_SECRET

    - secretKey: DEMO_USER_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.runtimeSecretName }}
        property: DEMO_USER_PASSWORD
