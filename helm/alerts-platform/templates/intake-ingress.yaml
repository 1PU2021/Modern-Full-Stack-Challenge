{{- if .Values.intake.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intake
  namespace: {{ .Values.global.namespace }}
  annotations:
{{ toYaml .Values.intake.ingress.annotations | indent 4 }}

spec:
  ingressClassName: {{ .Values.intake.ingress.className }}

  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: intake
                port:
                  number: {{ .Values.intake.service.port }}

          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
