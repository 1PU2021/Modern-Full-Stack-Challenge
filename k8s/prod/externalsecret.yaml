apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerts-runtime-secrets
  namespace: alerts-prod

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: alerts-runtime-secrets
    creationPolicy: Owner

    template:
      engineVersion: v2
      data:
        # The normal application services intentionally use app_user for
        # both variables. DATABASE_URL is required by the shared config
        # schema, but intake/fanout/dispatch actually create their pools
        # from APP_DATABASE_URL.
        #
        # The Aurora master DATABASE_URL is reserved for migration/admin
        # jobs and is NOT exposed to normal application workloads.
        DATABASE_URL: >-
          postgres://{{ .DB_USERNAME }}:{{ .DB_PASSWORD }}@{{ .DB_HOST }}:{{ .DB_PORT }}/{{ .DB_NAME }}?sslmode=verify-full

        APP_DATABASE_URL: >-
          postgres://{{ .DB_USERNAME }}:{{ .DB_PASSWORD }}@{{ .DB_HOST }}:{{ .DB_PORT }}/{{ .DB_NAME }}?sslmode=verify-full

        JWT_SECRET: "{{ .JWT_SECRET }}"
        PLATFORM_JWT_SECRET: "{{ .PLATFORM_JWT_SECRET }}"
        DEMO_USER_PASSWORD: "{{ .DEMO_USER_PASSWORD }}"

  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: prod/alerts/app-db
        property: username

    - secretKey: DB_PASSWORD
      remoteRef:
        key: prod/alerts/app-db
        property: password

    - secretKey: DB_HOST
      remoteRef:
        key: prod/alerts/app-db
        property: host

    - secretKey: DB_PORT
      remoteRef:
        key: prod/alerts/app-db
        property: port

    - secretKey: DB_NAME
      remoteRef:
        key: prod/alerts/app-db
        property: dbname

    - secretKey: JWT_SECRET
      remoteRef:
        key: prod/alerts/app-runtime
        property: JWT_SECRET

    - secretKey: PLATFORM_JWT_SECRET
      remoteRef:
        key: prod/alerts/app-runtime
        property: PLATFORM_JWT_SECRET

    - secretKey: DEMO_USER_PASSWORD
      remoteRef:
        key: prod/alerts/app-runtime
        property: DEMO_USER_PASSWORD
