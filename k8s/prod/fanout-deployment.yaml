apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanout
  namespace: alerts-prod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fanout

  template:
    metadata:
      labels:
        app: fanout

    spec:
      serviceAccountName: fanout

      containers:
        - name: fanout
          image: 942010118414.dkr.ecr.us-east-2.amazonaws.com/alerts-fanout:0.1.0

          command: ["npm", "run", "fanout"]

          ports:
            - name: http
              containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: NODE_EXTRA_CA_CERTS
              value: /etc/rds-ca/global-bundle.pem

          envFrom:
            - configMapRef:
                name: alerts-config

            - secretRef:
                name: alerts-runtime-secrets

          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true

          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca-bundle
