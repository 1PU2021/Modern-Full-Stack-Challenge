name: Test OIDC

on:
  push:
    branches:
      - '**'   # runs on every branch push, including main and test branches

permissions:
  id-token: write   # required — this is what lets GitHub mint the OIDC token
  contents: read

jobs:
  verify-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::942010118414:role/github-actions-deploy-role
          aws-region: us-east-2

      - name: Confirm assumed identity
        run: aws sts get-caller-identity

# trigger test
